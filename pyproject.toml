[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recagent-eval"
version = "0.1.0"
description = "An evaluation-first conversational movie recommendation agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RecAgent-Eval contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
demo = ["gradio>=5,<7"]
# Shared approved ML stack: dense retrieval now, LambdaMART in a later task.
ml = [
  "lightgbm>=4.5,<5",
  "scikit-learn>=1.5,<2",
  "sentence-transformers>=3.3,<6",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
recagent-eval = "recagent_eval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/recagent_eval"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
